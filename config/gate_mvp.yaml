strategy:
  venue: gate
  symbol: XRP_USDT
  size: 10
  min_half_spread_bps: 40.0
  reprice_fraction: 0.375 # legacy reprice_bps/spread_bps = 15 / 40
  quote_interval_ms: 50 # this is the clock for the quoting system
  cancellation_delay_ms: 50 # buffer after first-side cancel before opposite-side cancel
feeds: # valid options per exchange: true (force on), false (force off), auto (only run when symbol available)
  gate: true
  binance: auto
  bybit: auto
  bitget: auto
  okx: auto
  mexc: false
  lighter: auto
risk:
  max_order_notional: 400.0
  max_position_notional: 500.0
mode:
  dry_run: true #switch for live vs dry run
  log_fills: false
  debug_prints: true
  demean_prices: false #toggle to subtract per-feed bias before quoting/logging
logging:
  enabled: true
  path: logs/gate_activity.csv
  flush_interval_ms: 200
credentials:
  api_key_env: gateio_api_key
  api_secret_env: gateio_secret_key
