strategy_kind: momentum_fade
strategy:
  venue: lighter
  symbol: SOL_USDT
  size: min
momentum_fade:
  entry_price_source: model
  lookback_ms: 142
  entry_threshold_bps: 1
  entry_threshold_bps_bid: 1
  entry_threshold_bps_ask: 1
  tick_offset: 1
  tick_offset_bid: 1
  tick_offset_ask: 1
  adverse_threshold_bps: 0
  adverse_threshold_bps_bid: 0
  adverse_threshold_bps_ask: 0
  max_age_ms: 700
  max_age_ms_bid: 700
  max_age_ms_ask: 700
  min_interval_ms: 50
pricing_model:
  enabled: true
  time_basis: wire
  kalman:
    ref_stream: lighter:orderbook
    k_per_sec: 0.0
    q_per_sec: 0.000001
    gamma_imb: 0.0
    bias_by_stream: {}
    stats_alpha: 0.02
    stats_warmup_obs: 50
    r_learn_alpha: 0.02
    r_learn_warmup_obs: 200
    r_floor: 1e-10
    r_ceiling: 0.01
